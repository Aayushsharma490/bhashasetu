name: 🚀 Build & Deploy BhashaSetu

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Build Web App + Deploy to Netlify
  # ─────────────────────────────────────────────────────────────
  deploy-web:
    name: 🌐 Build & Deploy Web (Netlify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './dist'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions — ${{ github.sha }}"
          enable-pull-request-comment: true
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build Android APK via Capacitor + Gradle
  # ─────────────────────────────────────────────────────────────
  build-android-apk:
    name: 📱 Build Android APK (Capacitor)
    runs-on: ubuntu-latest
    needs: []   # Can run in parallel with web deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17 (required by Capacitor 7 / Gradle 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (dist/)
        run: npm run build

      - name: Sync Capacitor → android/
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build DEBUG APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BhashaSetu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}-$(date +'%Y%m%d')"
          name: "BhashaSetu APK — Build #${{ github.run_number }}"
          body: |
            🎓 **BhashaSetu — Offline Classroom Assistant**
            
            Auto-built from commit: `${{ github.sha }}`
            
            ### 📲 Installation
            1. Download `BhashaSetu-debug.apk` below
            2. On Android: Settings → Security → Allow Unknown Sources
            3. Install and enjoy offline!
            
            **App ID:** `in.gov.jharkhand.bhashasetu`
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
